# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
    version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
    sources:
        - id: trunk
          ref: v1.11.0
          uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
    enabled:
        - go@1.21.0
        - python@3.14.4
        - node@22.22.2
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
    disabled:
        - actionlint
    ignore:
        - linters: [ALL]
          paths:
              - '**/worker-configuration.d.ts'
              - convex/_generated/**
        - linters: [osv-scanner]
          paths:
              - '**/pnpm-lock.yaml'
        # docs-kit-generated LLM mirrors of site pages; headings mirror the
        # site's brutalist style (trailing periods etc.), not authored prose.
        - linters: [markdownlint]
          paths:
              - docs/static/docs/**
              - docs/static/examples/**
              - docs/static/examples.md
              - docs/static/llms*.txt
        - linters: [eslint, prettier]
          paths:
              - '**/worker-configuration.d.ts'
    definitions:
        - name: prettier
          files:
              - typescript
              - svelte
              - yaml
              - css
              - postcss
              - sass
              - html
              - markdown
              - json
              - javascript
              - graphql
              - prettier_supported_configs
        - name: eslint
          files:
              - typescript
              - svelte
              - javascript
    enabled:
        - grype@0.119.0
        - sort-package-json@4.0.0
        - checkov@3.3.19
        - eslint@10.11.0
        - git-diff-check
        - markdownlint@0.49.1
        - osv-scanner@2.6.0
        - oxipng@10.2.1
        - prettier@3.9.9
        - shellcheck@0.11.0
        - shfmt@3.14.1
        - svgo@4.1.0
        - taplo@0.10.0
        - trufflehog@3.97.9
        - yamllint@1.38.0
        - zizmor@1.30.1
actions:
    disabled:
        - trunk-announce
        - trunk-check-pre-push
        - trunk-fmt-pre-commit
        - trunk-upgrade-available
tools:
    enabled:
        - oxfmt@0.70.0
